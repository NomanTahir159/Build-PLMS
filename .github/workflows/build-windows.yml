name: Build Medicsoft PLMS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 NSIS Installer
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify approved installer HTML and controls
        shell: pwsh
        run: |
          python scripts/build_installer_ui.py
          if ($LASTEXITCODE -ne 0) { throw "Installer HTML generation failed." }
          npm install --prefix .installer-test-runtime --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          if ($LASTEXITCODE -ne 0) { throw "Installer test dependency setup failed." }
          $env:NODE_PATH = Join-Path $PWD '.installer-test-runtime/node_modules'
          node tests/installer_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw "Installer HTML interaction checks failed." }

      - name: Verify installer artwork, callbacks and layout
        shell: pwsh
        run: |
          python tests/verify_installer.py
          if ($LASTEXITCODE -ne 0) { throw "Installer source verification failed." }

      - name: Build and test native PLMS installer theme
        shell: pwsh
        run: |
          python scripts/build_installer_theme.py
          if ($LASTEXITCODE -ne 0) { throw "PLMS native installer theme checks failed." }

      - name: Verify frontend workflows and desktop integration
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $PWD '.installer-test-runtime/node_modules'
          node frontend/verify.cjs
          if ($LASTEXITCODE -ne 0) { throw "Frontend verification failed." }

      - name: Verify frontend with Windows source line endings
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $PWD '.installer-test-runtime/node_modules'
          node frontend/verify-line-endings.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows line-ending verification failed." }

      - name: Verify current report grouping and letter formatting
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $PWD '.installer-test-runtime/node_modules'
          node tests/report-reference-grouping.cjs
          if ($LASTEXITCODE -ne 0) { throw "Report reference grouping checks failed." }
          node tests/letter-formatting.cjs
          if ($LASTEXITCODE -ne 0) { throw "Letter formatting checks failed." }

      - name: Verify database security and workflows
        shell: pwsh
        run: |
          python backend/verify.py
          if ($LASTEXITCODE -ne 0) { throw "Database verification failed." }

      - name: Validate bundled Google Desktop OAuth client
        shell: pwsh
        env:
          PLMS_GOOGLE_CLIENT_JSON: ${{ secrets.PLMS_GOOGLE_CLIENT_JSON }}
        run: |
          if (!(Test-Path 'backend/google-drive-client.json') -and $env:PLMS_GOOGLE_CLIENT_JSON) {
            [System.IO.File]::WriteAllText((Join-Path $PWD 'backend/google-drive-client.json'), $env:PLMS_GOOGLE_CLIENT_JSON, [System.Text.UTF8Encoding]::new($false))
          }
          python backend/check_google_client.py
          if ($LASTEXITCODE -ne 0) { throw "Google Desktop client configuration is missing or invalid." }

      - name: Build and verify the PLMS database resource
        shell: pwsh
        run: |
          python backend/build_resources.py
          if ($LASTEXITCODE -ne 0) { throw "PLMS backend resource packaging failed." }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version 2.12.0 --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri CLI installation failed." }
          cargo tauri --version
          if ($LASTEXITCODE -ne 0) { throw "Tauri CLI is unavailable." }

      - name: Build Windows installer
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "PLMS installer build failed." }

      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          node scripts/name-installer.cjs
          if ($LASTEXITCODE -ne 0) { throw "Installer naming failed." }
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($installers.Count -eq 0) { throw "No NSIS installer was generated." }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -Encoding ascii ($installer.FullName + ".sha256")
            Write-Host "Installer: $($installer.Name)"
          }

      - name: Deliver installer through GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.cjs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release delivery failed." }
