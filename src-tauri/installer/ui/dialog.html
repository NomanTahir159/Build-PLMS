<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Medicsoft PLMS</title><style>
#plms-setup-preview{font-family:'Segoe UI',Arial,sans-serif;color:#173e2d;width:100%;--plms-deep:#0f4f38;--plms-green:#188b59;--plms-text:#153e2c;--plms-secondary:#5a7968;--plms-border:#a5bfae}
#plms-setup-preview *{box-sizing:border-box}
#plms-setup-preview [hidden]{display:none!important}
#plms-setup-preview .preview-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;color:light-dark(#173e2d,#e3f1e9);font-size:14px;padding-right:90px}
#plms-setup-preview .preview-controls button,#plms-setup-preview select{font:inherit;border:1px solid light-dark(#becbc2,#53675c);background:light-dark(#fff,#253a2d);color:light-dark(#173e2d,#e3f1e9);border-radius:6px;padding:8px 10px;max-width:100%}
#plms-setup-preview .preview-controls label{font-size:13px}
#plms-setup-preview #plms-count{font-size:12px;color:light-dark(#567061,#acbeb3)}
#plms-setup-preview .preview-stage{padding:16px 0 22px;width:100%;overflow:hidden}
#plms-setup-preview .window-slot{margin:0 auto;position:relative}
#plms-setup-preview .setup-window{width:952px;height:998px;transform-origin:top left;border:1px solid #9cb7a7;border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 10px 25px #113e2920;position:relative}
#plms-setup-preview .window-title{height:50px;display:flex;align-items:center;gap:16px;padding:0 16px;background:linear-gradient(#fff,#f6fbf8);font-size:22px;color:#153e2c;border-bottom:1px solid #c8d8cf}
#plms-setup-preview .small-logo{height:32px;width:32px;object-fit:contain}
#plms-setup-preview .window-spacer{flex:1}
#plms-setup-preview .window-symbol{width:72px;text-align:center;font-size:30px;font-weight:400;line-height:1}
#plms-setup-preview .close-symbol{font-size:39px}
#plms-setup-preview .setup-heading{height:126px;background:linear-gradient(105deg,#0f4f38,#176446);padding:23px 40px;color:#fff}
#plms-setup-preview .setup-heading h2{font-size:40px;line-height:1.2;font-weight:600;margin:0 0 6px;color:#fff;letter-spacing:-.7px}
#plms-setup-preview .setup-heading p{font-size:28px;line-height:1.3;margin:0;color:#fff}
#plms-setup-preview .setup-progress{position:absolute;top:176px;left:0;right:0;height:12px;background:#e0ebe4;z-index:2}
#plms-setup-preview .setup-progress>div{width:68%;height:100%;background:linear-gradient(#41bd83,#188b59)}
#plms-setup-preview .setup-body{height:734px;position:relative;background:linear-gradient(125deg,#fff 25%,#f2faf5);padding:40px 40px 0}
#plms-setup-preview .product-brand{text-align:center;position:relative;z-index:1}
#plms-setup-preview .product-logo{display:block;margin:0 auto;width:144px;height:144px;object-fit:contain}
#plms-setup-preview .product-name{font-size:64px;line-height:1.14;letter-spacing:-2px;font-weight:700;margin-top:10px;color:#0f4f38}
#plms-setup-preview .product-subtitle{font-size:26px;line-height:1.4;letter-spacing:.25px;color:#587a66}
#plms-setup-preview .page-content{position:relative;z-index:1;margin-top:29px;font-size:23px;line-height:1.4;color:#163e2c}
#plms-setup-preview .folder-label{display:block;font-size:23px;margin-bottom:8px;font-weight:500}
#plms-setup-preview .folder-row{display:flex;gap:18px;margin-bottom:22px}
#plms-setup-preview .folder-row input{height:56px;min-width:0;flex:1;font:inherit;font-size:23px;color:#183e2c;padding:8px 16px;border:1px solid #a2bbaa;border-radius:5px;background:#fff}
#plms-setup-preview .glass{font-family:inherit;font-size:23px;line-height:1.2;border:1px solid #95b6a2;border-radius:5px;background:linear-gradient(#fff,#e5ece8);color:#173f2d;box-shadow:inset 0 1px #fff9;min-width:180px;height:54px;padding:8px 20px;white-space:nowrap}
#plms-setup-preview .glass:hover{background:linear-gradient(#fafffc,#dce9e1)}
#plms-setup-preview .folder-row .glass{min-width:176px;height:56px;font-size:21px}
#plms-setup-preview .glass.primary{background:linear-gradient(#48bd86,#188b59);border-color:#14834f;color:#fff}
#plms-setup-preview .glass.primary:hover{background:linear-gradient(#42b67e,#147e4f)}
#plms-setup-preview .glass.danger{background:linear-gradient(#fff8f8,#f8dfdf);border-color:#d99e9e;color:#8d2727}
#plms-setup-preview .glass.danger:hover{background:linear-gradient(#fff0f0,#f4d1d1)}
#plms-setup-preview .check{display:flex;align-items:flex-start;gap:15px;margin:15px 0;font-size:23px}
#plms-setup-preview input[type=checkbox],#plms-setup-preview input[type=radio]{accent-color:#188b59;flex:0 0 auto;width:28px;height:28px;margin:2px 0 0}
#plms-setup-preview .check small{display:block;font-size:21px;margin-top:4px;color:#587a66}
#plms-setup-preview .check .delete-label{font-size:22px}
#plms-setup-preview .question{font-weight:600;font-size:28px;margin:0 0 16px}
#plms-setup-preview .status-line{font-weight:600;font-size:29px;margin:14px 0 3px}
#plms-setup-preview .status-detail{font-size:25px;color:#587a66;margin:0}
#plms-setup-preview .success{display:flex;align-items:center;gap:24px;margin-top:23px;font-size:27px}
#plms-setup-preview .success-mark{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:65px;height:65px;background:linear-gradient(#35c36d,#12a74d);border-radius:50%;color:#fff;font-size:43px;font-weight:500;line-height:1}
#plms-setup-preview .success small{display:block;font-size:22px;color:#587a66;margin-top:8px}
#plms-setup-preview .radio-choice{display:flex;align-items:flex-start;gap:23px;margin:0 0 16px;padding:0;background:transparent}
#plms-setup-preview .radio-choice input{width:30px;height:30px;margin-top:5px}
#plms-setup-preview .radio-choice strong{font-size:27px;font-weight:600;display:block}
#plms-setup-preview .radio-choice small{font-size:23px;color:#587a66;display:block;margin-top:1px}
#plms-setup-preview .retention{display:flex;align-items:center;gap:19px;font-size:22px;margin-top:19px}
#plms-setup-preview .info-mark{background:#188b59;color:#fff;border-radius:50%;font-family:Georgia,serif;font-size:25px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;flex-shrink:0}
#plms-setup-preview .setup-footer{height:86px;position:absolute;bottom:0;left:0;right:0;border-top:1px solid #afc9b9;background:linear-gradient(#fbfefc,#f0f7f3);padding:16px 24px 16px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
#plms-setup-preview #plms-footer-note{font-size:20px;color:#5c7d69;line-height:1.3}
#plms-setup-preview #plms-footer-actions{margin-left:auto;display:flex;gap:22px}
#plms-setup-preview .lab-art{position:absolute;height:152px;bottom:0;left:0;right:0;overflow:hidden;pointer-events:none;color:#b4d9c1;opacity:.7}
#plms-setup-preview .lab-tubes,#plms-setup-preview .lab-microscope{position:absolute;bottom:8px;left:90px}
#plms-setup-preview .lab-microscope{left:625px}
#plms-setup-preview .lab-tubes svg{width:140px;height:140px;stroke-width:.65}
#plms-setup-preview .lab-microscope svg{width:132px;height:144px;stroke-width:.65}
#plms-setup-preview .wave{position:absolute;width:690px;height:120px;border:1px solid #b4d9c1;border-radius:50%;transform:rotate(9deg);left:-100px;top:54px}
#plms-setup-preview .wave-b{left:440px;top:25px;transform:rotate(-12deg)}
#plms-setup-preview .molecule{position:absolute;width:130px;height:70px;bottom:30px;left:380px;border-top:1px solid #b4d9c1;transform:rotate(-25deg)}
#plms-setup-preview .molecule-b{left:800px;bottom:35px;transform:rotate(27deg)}
#plms-setup-preview .molecule b{position:absolute;top:-5px;width:9px;height:9px;background:#b4d9c1;border-radius:50%;left:0}
#plms-setup-preview .molecule b:nth-child(2){left:42px;top:20px}
#plms-setup-preview .molecule b:nth-child(3){left:85px}
#plms-setup-preview .molecule b:nth-child(4){left:130px;top:20px}

#plms-setup-preview .window-symbol:hover{background:#e5eee8}
#plms-setup-preview .close-symbol:hover{background:#f5dada}

  </section></div><script>(function(){
 'use strict';
 const root=document.getElementById('plms-setup-preview'),content=root.querySelector('#plms-page-content'),footer=root.querySelector('#plms-footer-actions'),win=root.querySelector('.setup-window');
 const states=['install','installing','installed','maintenance','uninstall','uninstalling','uninstalled'];
 const captions={install:['Installation Options','Set up Medicsoft PLMS on your computer'],installing:['Installing','Installing application files'],installed:['Installation Complete','Medicsoft PLMS is ready to use'],maintenance:['PLMS Is Already Installed','Choose how you want to continue'],uninstall:['Uninstall Medicsoft PLMS','Choose what to remove'],uninstalling:['Uninstalling','Removing application files'],uninstalled:['Uninstall Complete','Medicsoft PLMS has been removed']};
 let current={state:'install',percent:0,folder:'',desktop:true,launch:true,remove:false,maintenance:'repair',canRepair:true},locked=false;
 const bridge=window.chrome?.webview;
 function send(parts){if(bridge)bridge.postMessage(parts.join('\t'));else window.dispatchEvent(new CustomEvent('plms-preview-action',{detail:parts}));}
 function act(parts){if(locked)return;locked=true;send(parts);}
 function button(text,kind,action){const b=document.createElement('button');b.type='button';b.className='glass '+kind;b.textContent=text;b.addEventListener('click',action);footer.appendChild(b);return b;}
 function progress(value){const percent=Math.max(0,Math.min(100,Number(value)||0));current.percent=percent;const busy=current.state==='installing'||current.state==='uninstalling';root.querySelector('#plms-heading').textContent=captions[current.state][0]+(busy?' ('+percent+'%)':'');const track=root.querySelector('.setup-progress');track.hidden=!busy;track.setAttribute('aria-valuenow',String(percent));track.setAttribute('aria-label',current.state==='uninstalling'?'Uninstallation progress':'Installation progress');track.firstElementChild.style.width=percent+'%';}
 function show(data){
  if(!data||!states.includes(data.state))return;
  current={...current,...data};locked=false;
  const state=current.state,uninstall=state.startsWith('uninstall');
  root.querySelector('#plms-window-name').textContent='Medicsoft PLMS '+(uninstall?'Uninstall':'Setup');
  root.querySelector('#plms-subheading').textContent=captions[state][1];
  root.querySelector('#plms-footer-note').textContent='';footer.replaceChildren();progress(current.percent);
  if(state==='install'){
   content.innerHTML='<label class="folder-label" for="plms-folder">Installation Folder</label><div class="folder-row"><input id="plms-folder" aria-label="Installation folder" required><button type="button" class="glass" id="plms-browse">Browse…</button></div><label class="check"><input id="plms-desktop" type="checkbox"><span>Create a desktop shortcut</span></label><label class="check"><input id="plms-launch" type="checkbox"><span>Launch PLMS after installation</span></label>';
   content.querySelector('#plms-folder').value=current.folder;
   content.querySelector('#plms-desktop').checked=current.desktop;content.querySelector('#plms-launch').checked=current.launch;
   const values=()=>[content.querySelector('#plms-folder').value,content.querySelector('#plms-desktop').checked?'1':'0',content.querySelector('#plms-launch').checked?'1':'0'];
   content.querySelector('#plms-browse').onclick=()=>send(['browse',...values()]);
   button('Cancel','',()=>act(['cancel']));button('Install','primary',()=>{const field=content.querySelector('#plms-folder');if(!field.value.trim()){field.reportValidity();field.focus();return;}act(['install',...values()]);});
  }else if(state==='installing'||state==='uninstalling'){
   content.innerHTML='<p class="status-line">'+(uninstall?'Uninstalling':'Installing')+' Medicsoft PLMS…</p><p class="status-detail">'+(uninstall?(current.remove?'Removing selected PLMS data.':'Your saved data is being retained.'):'Copying application resources')+'</p>';
   root.querySelector('#plms-footer-note').textContent='Please wait while '+(uninstall?'removal':'setup')+' completes.';
   if(!uninstall)button('Cancel','',()=>act(['cancel']));
  }else if(state==='installed'||state==='uninstalled'){
   content.innerHTML='<div class="success"><span class="success-mark" aria-hidden="true">✓</span><div>'+(uninstall?'Uninstallation':'Installation')+' completed successfully.'+(uninstall?'<small>'+(current.remove?'Your selected PLMS data has been removed.':'Your patient records and backups have been retained.')+'</small>':'')+'</div></div>';
   button('Finish','primary',()=>act(['finish']));
  }else if(state==='maintenance'){
   content.innerHTML=['repair','uninstall','exit'].map((value,i)=>'<label class="radio-choice"><input type="radio" name="plms-maintenance" value="'+value+'" '+(current.maintenance===value?'checked':'')+(value==='repair'&&!current.canRepair?' disabled':'')+'><span><strong>'+['Repair Installation','Uninstall PLMS','Exit Setup'][i]+'</strong><small>'+['Reinstall application files and keep existing data.','Remove the application from this computer.','Keep the current installation.'][i]+'</small></span></label>').join('')+'<div class="retention"><span class="info-mark" aria-hidden="true">i</span><span>Your patient records and settings are retained by default.</span></div>';
   button('Cancel','',()=>act(['cancel']));button('Continue','primary',()=>act(['continue',content.querySelector('input:checked')?.value||'repair']));
  }else{
   content.innerHTML='<p class="question">Remove Medicsoft PLMS from this computer?</p><label class="check"><input type="checkbox" id="plms-delete-data"><span class="delete-label">Delete patient records, catalog, settings and backups<small>Leave unchecked to keep your data for reinstallation.</small></span></label>';
   content.querySelector('#plms-delete-data').checked=current.remove;
   button('Cancel','',()=>act(['cancel']));button('Uninstall','danger',()=>act(['uninstall',content.querySelector('#plms-delete-data').checked?'1':'0']));
  }
 }
 function fit(){const scale=Math.min(1,innerWidth/952,innerHeight/998);win.style.transform='translate(-50%,-50%) scale('+scale+')';}
 root.querySelector('[data-chrome=minimize]').onclick=()=>send(['minimize']);
 root.querySelector('[data-chrome=close]').onclick=()=>{if(current.state!=='uninstalling')act(['cancel']);};
 root.querySelector('.window-title').addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('button'))send(['drag']);});
 addEventListener('resize',fit);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&current.state!=='uninstalling'){event.preventDefault();act(['cancel']);}else if(event.key==='Enter'&&!['installing','uninstalling'].includes(current.state)){event.preventDefault();footer.querySelector('.primary,.danger')?.click();}});
 if(bridge)bridge.addEventListener('message',event=>{const data=event.data;if(data?.kind==='progress')progress(data.percent);else if(data?.kind==='folder'){const field=content.querySelector('#plms-folder');if(field)field.value=data.folder;}else if(data?.kind==='unlock')locked=false;else {show(data);Promise.all(Array.from(root.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});}))).then(()=>send(['painted']));}});
 window.plmsInstaller={show,progress,get state(){return {...current}}};
 show(current);fit();if(bridge)send(['ready']);
})();
</script></body></html>
