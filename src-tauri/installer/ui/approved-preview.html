 }else if(state==='installed'||state==='uninstalled'){

 }else if(state==='maintenance'){

 }else{
 content.innerHTML='<p class="question">Remove Medicsoft PLMS from this computer?</p><label class="check"><input type="checkbox" id="plms-delete-data"><span class="delete-label">Delete patient records, catalog, settings and backups<small>Leave unchecked to keep your data for reinstallation.</small></span></label>';content.querySelector('input').checked=remove;content.querySelector('input').onchange=e=>remove=e.target.checked;button('Cancel','',()=>show('maintenance'));button('Uninstall','danger',()=>show('uninstalling'));
 }
}
select.onchange=()=>show(select.value);root.querySelector('#plms-prev').onclick=()=>show(states[(states.indexOf(select.value)+6)%7]);root.querySelector('#plms-next').onclick=()=>show(states[(states.indexOf(select.value)+1)%7]);
