[package]
name = "plms_beta"
version = "1.0.0"
description = "Medicsoft PLMS Desktop"
authors = ["Medicsoft Corporation"]
edition = "2021"

[lib]
name = "plms_beta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
